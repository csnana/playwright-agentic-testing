
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day 3 Shopping Cart</title>
</head>
<body>
  <h1>Login</h1>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" placeholder="Enter username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Enter password">
    <button type="button" id="login-button">Login</button>
    <!-- <button type="button" id="login-button" disabled>Login</button> -->
  </form>
  <hr>
  <h1>Shopping Page</h1>
  <label for="search">Search products</label>
  <input id="search" type="text" placeholder="Search products">
  <script>
  document.querySelector('#search').addEventListener('input', event => {
    const query = event.target.value.toLowerCase();
    document.querySelectorAll('section').forEach(section => {
      section.style.display = section.querySelector('h2').textContent.toLowerCase().includes(query) ? '' : 'none';
    });
  });
</script>
  <section>
    <h2>Cotton T-shirt</h2>
    <p>Price: ₹799</p>
    <label for="tshirt-quantity">Quantity</label>
    <input id="tshirt-quantity" type="number" value="1" min="1">
    <button type="button">Add to cart</button>
  </section>
  <section>
    <h2>Cotton Polo</h2>
    <p>Price: ₹999</p>
    <label for="polo-quantity">Quantity</label>
    <input id="polo-quantity" type="number" value="1" min="1">
    <button type="button">Add to cart</button>
  </section>
  <hr>

<h2>Shopping Cart</h2>
<p id="cart-count">Items in cart: 0</p>
<script>
  let cartCount = 0;
  document.querySelectorAll('section').forEach(section => {
    const button = section.querySelector('button');
    const quantity = section.querySelector('input[type="number"]');
    button.addEventListener('click', () => {
      cartCount += Number(quantity.value);
      document.querySelector('#cart-count').textContent = `Items in cart: ${cartCount}`;
    });
  });
</script>
</body>
</html>
